services:
  mongodb:
    image: mongo:7.0
    container_name: smart_taxi_mongodb
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    environment:
      MONGO_INITDB_DATABASE: ${DATABASE_NAME:?Set DATABASE_NAME in docker/.env}
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - smart_taxi_network

  emqx:
    image: emqx/emqx:5.8
    container_name: smart_taxi_emqx
    restart: always
    ports:
      - "1883:1883"
      - "8083:8083"
      - "8883:8883"
      - "18083:18083"
    volumes:
      - emqx_data:/opt/emqx/data
    environment:
      EMQX_ALLOW_ANONYMOUS: ${EMQX_ALLOW_ANONYMOUS:?Set EMQX_ALLOW_ANONYMOUS in docker/.env}
    healthcheck:
      test: ["CMD", "emqx", "ctl", "status"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - smart_taxi_network

  smart_taxi_service:
    build:
      context: ..
      dockerfile: ./Dockerfile
    container_name: smart_taxi_service
    restart: always
    ports:
      - "8080:8080"
    depends_on:
      mongodb:
        condition: service_healthy
      emqx:
        condition: service_healthy
    environment:
      - MONGODB_URI=${MONGODB_URI:?Set MONGODB_URI in docker/.env}
      - DATABASE_NAME=${DATABASE_NAME:?Set DATABASE_NAME in docker/.env}
      - APP_ENV=${APP_ENV:?Set APP_ENV in docker/.env}
      - SECRET_KEY=${SECRET_KEY:?Set SECRET_KEY in docker/.env}
      - FLASK_HOST=${FLASK_HOST:?Set FLASK_HOST in docker/.env}
      - FLASK_PORT=${FLASK_PORT:?Set FLASK_PORT in docker/.env}
      - FLASK_DEBUG=${FLASK_DEBUG:?Set FLASK_DEBUG in docker/.env}
      - MQTT_BROKER_HOST=${MQTT_BROKER_HOST:?Set MQTT_BROKER_HOST in docker/.env}
      - MQTT_BROKER_PORT=${MQTT_BROKER_PORT:?Set MQTT_BROKER_PORT in docker/.env}
      - MQTT_CLIENT_ID_PREFIX=${MQTT_CLIENT_ID_PREFIX:?Set MQTT_CLIENT_ID_PREFIX in docker/.env}
      - MQTT_USERNAME=${MQTT_USERNAME-}
      - MQTT_PASSWORD=${MQTT_PASSWORD-}
      - API_BASE_URL=${API_BASE_URL:?Set API_BASE_URL in docker/.env}
      - CDN_BASE_URL=${CDN_BASE_URL-}
      - UPLOAD_ROOT=${UPLOAD_ROOT:?Set UPLOAD_ROOT in docker/.env}
      - DEFAULT_VIDEO=${DEFAULT_VIDEO:?Set DEFAULT_VIDEO in docker/.env}
      - LOG_LEVEL=${LOG_LEVEL:?Set LOG_LEVEL in docker/.env}
    command: gunicorn -w 2 -b 0.0.0.0:8080 src.app:app --access-logfile - --error-logfile -
    volumes:
      - video_data:/app/uploads
    networks:
      - smart_taxi_network

  mqtt_worker:
    build:
      context: ..
      dockerfile: ./Dockerfile
    container_name: smart_taxi_mqtt_worker
    restart: always
    depends_on:
      mongodb:
        condition: service_healthy
      emqx:
        condition: service_healthy
    environment:
      - MONGODB_URI=${MONGODB_URI:?Set MONGODB_URI in docker/.env}
      - DATABASE_NAME=${DATABASE_NAME:?Set DATABASE_NAME in docker/.env}
      - APP_ENV=${APP_ENV:?Set APP_ENV in docker/.env}
      - MQTT_BROKER_HOST=${MQTT_BROKER_HOST:?Set MQTT_BROKER_HOST in docker/.env}
      - MQTT_BROKER_PORT=${MQTT_BROKER_PORT:?Set MQTT_BROKER_PORT in docker/.env}
      - MQTT_CLIENT_ID_PREFIX=${MQTT_CLIENT_ID_PREFIX:?Set MQTT_CLIENT_ID_PREFIX in docker/.env}
      - MQTT_USERNAME=${MQTT_USERNAME-}
      - MQTT_PASSWORD=${MQTT_PASSWORD-}
      - API_BASE_URL=${API_BASE_URL:?Set API_BASE_URL in docker/.env}
      - LOG_LEVEL=${LOG_LEVEL:?Set LOG_LEVEL in docker/.env}
    command: python run_mqtt_worker.py
    healthcheck:
      disable: true
    networks:
      - smart_taxi_network

volumes:
  mongodb_data:
  video_data:
  emqx_data:

networks:
  smart_taxi_network:
    driver: bridge
