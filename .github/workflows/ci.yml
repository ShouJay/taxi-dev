name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: robust_taxi
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: robust_taxi/requirements.txt
      - run: pip install -r requirements.txt
      - run: python -m compileall -q src run_app.py run_mqtt_worker.py
      - run: PYTHONPATH=. python -m unittest discover -s tests/unit -v
      - run: docker compose -f docker/docker-compose.yml config --quiet
      - run: docker build -t robust-taxi-ci .

  flutter:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: taxi_app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos --no-fatal-warnings
      - run: flutter test
      - run: flutter build apk --debug --flavor dev --dart-define-from-file=config/dev.json
